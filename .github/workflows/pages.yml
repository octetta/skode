name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Editor Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Erlang & Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download core dependencies
        run: gleam deps download

      - name: Download editor dependencies
        run: cd app/editor && gleam deps download

      - name: Build editor JavaScript target
        run: cd app/editor && gleam build --target javascript

      - name: Assemble static distribution
        run: |
          mkdir -p dist
          cp app/editor/index.html dist/
          cp app/editor/coi-serviceworker.js dist/ 2>/dev/null || true
          cp -r app/editor/wasm dist/
          mkdir -p dist/build/dev
          cp -r app/editor/build/dev/javascript dist/build/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
