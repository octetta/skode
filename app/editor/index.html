<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skode Voice Editor (Lustre / Pulp 0.85.0)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg-app: #0d1117;
      --bg-card: #161b22;
      --bg-card-subtle: #21262d;
      --bg-input: #0d1117;
      --border: #30363d;
      --border-muted: #21262d;
      --border-input: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-subtle: #1f6feb22;
      --code-color: #7ee787;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg-app: #f6f8fa;
      --bg-card: #ffffff;
      --bg-card-subtle: #f0f2f5;
      --bg-input: #ffffff;
      --border: #d0d7de;
      --border-muted: #e1e4e8;
      --border-input: #d0d7de;
      --text-primary: #1f2328;
      --text-secondary: #24292f;
      --text-muted: #57606a;
      --accent: #0969da;
      --accent-subtle: #0969da18;
      --code-color: #116329;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-secondary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    #app {
      width: 100%;
    }
    /* Light mode accessibility & contrast rules */
    [data-theme="light"] input[type="text"],
    [data-theme="light"] input[type="number"],
    [data-theme="light"] textarea,
    [data-theme="light"] select {
      background-color: #ffffff !important;
      color: #1f2328 !important;
      border-color: #d0d7de !important;
    }
    [data-theme="light"] input[type="text"]::placeholder {
      color: #8c959f !important;
    }
    [data-theme="light"] input[type="range"] {
      accent-color: #0969da;
    }
    [data-theme="light"] pre,
    [data-theme="light"] code {
      color: var(--code-color) !important;
    }
  </style>
  <!-- Load real Pulp 0.85.0 C Engine compiled to WebAssembly via Emscripten -->
  <script src="./wasm/skred_api.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { main } from "./build/dev/javascript/skode_editor/skode_editor.mjs";
    main();
  </script>
</body>
</html>
